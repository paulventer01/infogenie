name: Content safety enforcement

on:
  pull_request:
    paths:
      - 'services/ai_governance/**'
      - 'services/press_release/**'
      - 'services/ad_creative/**'
      - 'components/features/create/PressRelease.tsx'
      - 'components/features/create/AdCreative.tsx'
      - 'components/layout/ContentSafetyWarnings.tsx'
      - 'test/pr10h8-*.test.js'
      - 'test/pr10h9-*.test.js'
      - 'components/features/grow/LandingPages.tsx'
      - 'services/ai/chat_router.js'
      - 'services/marketing_brief/**'
      - 'services/seo_autopilot/reddit_aeo.js'
      - 'services/seo_autopilot/api.js'
      - 'services/tenants/permission_matrix.js'
      - 'components/features/manage/AiGovernanceHub.tsx'
      - 'components/features/manage/MarketingBrief.tsx'
      - 'test/content-safety-enforcement.test.js'
      - 'test/ai-governance-policy-permissions.test.js'
      - 'test/ai-governance.test.js'
      - 'test/browser/content-safety-governance.test.js'
      - 'test/helpers/**'
      - '.github/workflows/content-safety-enforcement.yml'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify content safety enforcement unit tests
        run: node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit test/content-safety-enforcement.test.js test/ai-governance.test.js
      - name: Verify press release and ad creative safety API and rendered UI
        run: node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit test/pr10h8-press-ad-safety.test.js test/pr10h8-press-ad-safety-ui.test.js
      - name: Verify ad copy, scoring and UGC safety
        run: node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit test/pr10h9-ad-copy-safety.test.js test/pr10h9-ad-copy-safety-ui.test.js

  integration-postgres:
    name: Policy permissions + audit redaction (zero skips)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infogenie_content_safety
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infogenie_content_safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enable PostgreSQL TLS for integration harness
        env:
          PR10H1_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --user root "$PR10H1_POSTGRES_CONTAINER" sh -ec '
            openssl req -new -x509 -days 1 -nodes -out /var/lib/postgresql/server.crt \
              -keyout /var/lib/postgresql/server.key -subj "/CN=localhost"
            chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
            chmod 600 /var/lib/postgresql/server.key
          '
          docker exec "$PR10H1_POSTGRES_CONTAINER" psql -U postgres -d infogenie_content_safety -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker restart "$PR10H1_POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            docker exec "$PR10H1_POSTGRES_CONTAINER" pg_isready -U postgres -d infogenie_content_safety && break
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done
      - name: Verify ai-governance policy permissions and audit redaction
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/infogenie_content_safety
          PR10H1_REQUIRE_INTEGRATION: '1'
          CREDENTIAL_ENCRYPTION_KEY: Mqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq=
          SESSION_SECRET: pr10h1-integration-session
          INFOGENIE_API_KEY: pr10h1-integration-api-key
          PERMISSION_ENFORCEMENT: 'on'
          MULTITENANT_ENFORCEMENT: 'on'
          SECURITY_CSRF: 'on'
        run: |
          set -o pipefail
          node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit test/ai-governance-policy-permissions.test.js | tee /tmp/pr10h1-integration.tap
          grep -Eq '^# tests [1-9][0-9]*$' /tmp/pr10h1-integration.tap
          grep -Eq '^# fail 0$' /tmp/pr10h1-integration.tap
          grep -Eq '^# skipped 0$' /tmp/pr10h1-integration.tap

  browser-postgres:
    name: AI Governance Hub Chromium + PostgreSQL (zero skips)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infogenie_agency_browser
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infogenie_agency_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for Puppeteer
        run: npx --no-install puppeteer browsers install chrome
      - name: Enable PostgreSQL TLS for browser harness
        env:
          PR10H1_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --user root "$PR10H1_POSTGRES_CONTAINER" sh -ec '
            openssl req -new -x509 -days 1 -nodes -out /var/lib/postgresql/server.crt \
              -keyout /var/lib/postgresql/server.key -subj "/CN=localhost"
            chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
            chmod 600 /var/lib/postgresql/server.key
          '
          docker exec "$PR10H1_POSTGRES_CONTAINER" psql -U postgres -d infogenie_agency_browser -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker restart "$PR10H1_POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            docker exec "$PR10H1_POSTGRES_CONTAINER" pg_isready -U postgres -d infogenie_agency_browser && break
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done
      - name: Verify AI Governance Hub browser journey
        shell: bash
        env:
          PR10E9_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/infogenie_agency_browser
          PR10H1_REQUIRE_BROWSER: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit test/browser/content-safety-governance.test.js | tee /tmp/pr10h1-browser.tap
          grep -Eq '^# tests [1-9][0-9]*$' /tmp/pr10h1-browser.tap
          grep -Eq '^# fail 0$' /tmp/pr10h1-browser.tap
          grep -Eq '^# skipped 0$' /tmp/pr10h1-browser.tap
