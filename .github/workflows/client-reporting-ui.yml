name: Client reporting UI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'public/**'
      - 'styles/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'services/**'
      - 'server.js'
      - 'db.js'
      - 'middleware.ts'
      - 'next.config.ts'
      - 'package*.json'
      - 'test/browser/**'
      - 'test/helpers/**'
      - 'test/client-reporting-ui.test.js'
      - 'test/client-reporting-mapping-ui.test.js'
      - 'test/client-reporting-report-ui.test.js'
      - 'test/client-reporting-permissions.test.js'
      - 'test/client-reporting-recipient.test.js'
      - 'test/client-reporting-recipient-ui.test.js'
      - 'test/client-reporting-delivery.test.js'
      - 'test/client-reporting-delivery-ui.test.js'
      - 'test/client-reporting-schedule.test.js'
      - 'test/client-reporting-schedule-ui.test.js'
      - 'test/client-reporting-schedule-validation.test.js'
      - 'test/client-reporting-portal-ui.test.js'
      - 'test/client-reporting-e2e-ui.test.js'
      - 'test/integration/client-reporting-recipients.test.js'
      - 'test/integration/client-reporting-schedule.test.js'
      - 'test/integration/client-reporting-portal.test.js'
      - 'docs/pr10f9-client-reporting-e2e.md'
      - '.github/workflows/client-reporting-ui.yml'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify profile form, access and navigation
        run: node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit test/client-reporting-ui.test.js test/client-reporting-mapping-ui.test.js test/client-reporting-report-ui.test.js test/client-reporting-recipient.test.js test/client-reporting-recipient-ui.test.js test/client-reporting-delivery.test.js test/client-reporting-delivery-ui.test.js test/client-reporting-schedule.test.js test/client-reporting-schedule-ui.test.js test/client-reporting-schedule-validation.test.js test/client-reporting-portal-ui.test.js test/client-reporting-e2e-ui.test.js test/client-reporting-permissions.test.js test/migrated-views-lockstep.test.js

  browser-postgres:
    name: Client reporting UI Chromium + PostgreSQL (zero skips)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infogenie_agency_browser
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infogenie_agency_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the Chromium version pinned by Puppeteer
        run: npx --no-install puppeteer browsers install chrome
      - name: Enable TLS on disposable PostgreSQL
        shell: bash
        env:
          PR10E9_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --user root "$PR10E9_POSTGRES_CONTAINER" sh -ec '
            openssl req -new -x509 -days 1 -nodes -out /var/lib/postgresql/server.crt \
              -keyout /var/lib/postgresql/server.key -subj "/CN=localhost"
            chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
            chmod 600 /var/lib/postgresql/server.key
          '
          docker exec "$PR10E9_POSTGRES_CONTAINER" psql -U postgres -d infogenie_agency_browser -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker restart "$PR10E9_POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            docker exec "$PR10E9_POSTGRES_CONTAINER" pg_isready -U postgres -d infogenie_agency_browser && break
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done
      - name: Verify browser journeys with real authorization and persistence
        shell: bash
        env:
          PR10E9_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/infogenie_agency_browser
          PR10E9_REQUIRE_BROWSER: '1'
          PR10F2_REQUIRE_BROWSER: '1'
          PR10F4_REQUIRE_BROWSER: '1'
          PR10F5_REQUIRE_BROWSER: '1'
          PR10F7_REQUIRE_BROWSER: '1'
          PR10F9_REQUIRE_BROWSER: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          result=0
          for suite in profiles mappings reports schedule e2e; do
            node --no-experimental-global-navigator --test --test-reporter=tap --test-force-exit "test/browser/client-reporting-${suite}.test.js" | tee "/tmp/client-reporting-${suite}-browser.tap" || result=1
            grep -Eq '^# tests [1-9][0-9]*$' "/tmp/client-reporting-${suite}-browser.tap" || result=1
            grep -Eq '^# fail 0$' "/tmp/client-reporting-${suite}-browser.tap" || result=1
            grep -Eq '^# skipped 0$' "/tmp/client-reporting-${suite}-browser.tap" || result=1
          done
          exit "$result"
      - name: Upload synthetic profile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-reporting-ui-screenshots
          path: /tmp/client-reporting-artifacts
          if-no-files-found: warn
          retention-days: 7
