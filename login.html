<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in · InfoGenie</title>
  <meta name="robots" content="noindex" />
  <!-- Standalone, self-contained login page. Intentionally loads NO app code
       (no app.js / data.js / public/js/*). Logged-out visitors only ever see
       this page; the server gate never serves them the app shell. -->
  <style>
    :root { --blue:#0066FF; --teal:#00C9C8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:radial-gradient(ellipse at top left,#0066FF22,transparent 60%),
                 radial-gradient(ellipse at bottom right,#00C9C822,transparent 60%),#0A1628; }
    .card { width:100%; max-width:440px; background:#fff; border-radius:20px;
      box-shadow:0 30px 80px rgba(0,0,0,.4); overflow:hidden; }
    .head { background:linear-gradient(135deg,var(--blue),var(--teal)); padding:28px 30px 22px; color:#fff; text-align:center; }
    .brand { display:inline-flex; align-items:center; gap:10px; margin-bottom:8px; }
    .brand span { font-family:'Plus Jakarta Sans',Inter,sans-serif; font-size:1.5rem; font-weight:800; letter-spacing:-.02em; }
    .brand span em { color:#A5F3FC; font-style:normal; }
    .tag { font-size:.82rem; opacity:.92; font-weight:500; }
    .body { padding:22px 28px 26px; }
    .tabs { display:flex; gap:6px; background:#F3F4F6; border-radius:10px; padding:4px; margin-bottom:18px; }
    .tab { flex:1; padding:9px 0; border:none; border-radius:7px; font-size:.83rem; font-weight:700; cursor:pointer; background:transparent; color:#6B7280; }
    .tab.on { background:#fff; color:var(--blue); box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .social { display:none; flex-direction:column; gap:8px; margin-bottom:14px; }
    .social button { display:flex; align-items:center; justify-content:center; gap:9px; padding:10px 14px;
      background:#fff; border:1.5px solid #E5E7EB; border-radius:10px; font-size:.84rem; font-weight:700; color:#1F2937; cursor:pointer; transition:background .12s; }
    .social button:hover { background:#F9FAFB; }
    .divider { display:none; align-items:center; gap:8px; margin:0 0 14px; color:#9CA3AF; font-size:.7rem; font-weight:600; }
    .divider .line { flex:1; height:1px; background:#E5E7EB; }
    .field { margin-bottom:12px; }
    label { display:block; font-size:.72rem; font-weight:700; color:#374151; margin-bottom:5px; }
    input { width:100%; padding:11px 13px; border:1.5px solid #E5E7EB; border-radius:9px; font-size:.88rem; outline:none; }
    input:focus { border-color:var(--blue); }
    .hint { display:none; font-size:.66rem; color:#6B7280; margin-top:4px; }
    .err { display:none; background:#FEE2E2; border:1px solid #FCA5A5; color:#991B1B; padding:9px 12px; border-radius:8px; font-size:.74rem; font-weight:600; margin-bottom:12px; }
    .notice { display:none; background:#ECFDF5; border:1px solid #6EE7B7; color:#065F46; padding:9px 12px; border-radius:8px; font-size:.74rem; font-weight:600; margin-bottom:12px; }
    .submit { width:100%; padding:13px; background:linear-gradient(135deg,var(--blue),var(--teal)); border:none; border-radius:10px;
      font-size:.92rem; font-weight:800; color:#fff; cursor:pointer; box-shadow:0 6px 18px rgba(0,102,255,.32); }
    .forgot { margin-top:12px; text-align:center; }
    .forgot button { background:none; border:none; color:var(--blue); font-size:.74rem; font-weight:700; cursor:pointer; padding:4px 6px; }
    .legal { margin-top:14px; text-align:center; font-size:.68rem; color:#9CA3AF; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="rgba(255,255,255,.18)"/><path d="M13 20 Q20 10 27 20 Q20 30 13 20Z" fill="white" opacity=".95"/><circle cx="20" cy="20" r="4" fill="white"/></svg>
        <span>Info<em>Genie</em></span>
      </div>
      <div class="tag">AI Marketing Intelligence — for your team</div>
    </div>
    <div class="body">
      <div class="tabs">
        <button class="tab on" data-tab="login">Log In</button>
        <button class="tab" data-tab="signup">Create Account</button>
      </div>

      <div id="social" class="social"></div>
      <div id="divider" class="divider"><div class="line"></div><span>or use email</span><div class="line"></div></div>

      <form id="form" autocomplete="on" onsubmit="return false">
        <div id="nameRow" class="field" style="display:none">
          <label for="name">Your name</label>
          <input id="name" type="text" placeholder="Jane Smith" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@company.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input id="pass" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" />
          <div id="passHint" class="hint">Min 8 characters. Hashed server-side with bcrypt.</div>
        </div>
        <div id="err" class="err"></div>
        <div id="notice" class="notice"></div>
        <button id="submit" class="submit" type="submit">Log In &rarr;</button>
        <div class="forgot"><button id="forgot" type="button">Forgot your password?</button></div>
      </form>
      <div class="legal">By continuing you agree that your settings &amp; campaigns will be saved to this account.</div>
    </div>
  </div>

  <script>
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var mode = 'login';

    async function api(path, opts){
      var r = await fetch(path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts || {}));
      var ct = r.headers.get('content-type') || '';
      var body = ct.indexOf('application/json') !== -1 ? await r.json().catch(function(){return {};}) : {};
      if (!r.ok) return { error: body.error || ('Request failed (' + r.status + ')') };
      return body;
    }
    function showErr(msg){ var e=$('err'); e.textContent=msg; e.style.display='block'; $('notice').style.display='none'; }
    function showNotice(msg){ var n=$('notice'); n.textContent=msg; n.style.display='block'; $('err').style.display='none'; }
    function setBusy(b, label){ var s=$('submit'); s.disabled=b; s.style.opacity=b?'0.65':'1'; s.style.cursor=b?'wait':'pointer'; if(label) s.innerHTML=label; }

    function setMode(m){
      mode = m;
      var tabs = document.querySelectorAll('.tab');
      for (var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('on', tabs[i].dataset.tab === m); }
      $('nameRow').style.display = m === 'signup' ? 'block' : 'none';
      $('passHint').style.display = m === 'signup' ? 'block' : 'none';
      $('submit').innerHTML = m === 'signup' ? 'Create account &rarr;' : 'Log In &rarr;';
      $('pass').setAttribute('autocomplete', m === 'signup' ? 'new-password' : 'current-password');
      $('err').style.display='none'; $('notice').style.display='none';
    }
    var tabs = document.querySelectorAll('.tab');
    for (var i=0;i<tabs.length;i++){ tabs[i].addEventListener('click', function(){ setMode(this.dataset.tab); }); }

    // ── Social provider buttons (only those configured server-side) ──────────
    (async function(){
      try {
        var r = await api('/api/auth/providers');
        var providers = (r && r.providers) || {};
        var enabled = Object.keys(providers).filter(function(k){ return providers[k]; });
        if (!enabled.length) return;
        var PRETTY = { google:'Google', facebook:'Facebook', microsoft:'Microsoft' };
        var ICONS = {
          google:    '<svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.8.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>',
          facebook:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12a12 12 0 1 0-13.88 11.85v-8.38h-3.04V12h3.04V9.36c0-3 1.79-4.67 4.53-4.67 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.87V12h3.32l-.53 3.47h-2.79v8.38A12 12 0 0 0 24 12z"/></svg>',
          microsoft: '<svg width="16" height="16" viewBox="0 0 23 23"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M12 1h10v10H12z"/><path fill="#00A4EF" d="M1 12h10v10H1z"/><path fill="#FFB900" d="M12 12h10v10H12z"/></svg>'
        };
        var row = $('social');
        row.innerHTML = enabled.map(function(p){
          return '<button type="button" data-provider="'+p+'">'+(ICONS[p]||'')+'<span>Continue with '+(PRETTY[p]||p)+'</span></button>';
        }).join('');
        row.style.display = 'flex';
        $('divider').style.display = 'flex';
        var btns = row.querySelectorAll('button');
        for (var j=0;j<btns.length;j++){
          btns[j].addEventListener('click', function(){
            window.location.href = '/api/auth/oauth/' + encodeURIComponent(this.dataset.provider) + '/start';
          });
        }
      } catch(e) { /* social row optional */ }
    })();

    // ── Forgot-password mini flow ───────────────────────────────────────────
    $('forgot').addEventListener('click', async function(){
      var email = ($('email').value || '').trim().toLowerCase();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return showErr('Type your email in the field above first, then click Forgot your password.');
      }
      var btn = this, orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        var r = await api('/api/auth/request-reset', { method:'POST', body: JSON.stringify({ email: email }) });
        if (r && r.error) showErr(r.error);
        else showNotice('If that email is registered, a password-reset link is on its way. Check your inbox.');
      } catch(e) { showErr('Network error — could not request reset.'); }
      btn.disabled = false; btn.textContent = orig;
    });

    // ── Submit (login / signup) ─────────────────────────────────────────────
    async function submit(){
      var name  = ($('name').value || '').trim();
      var email = ($('email').value || '').trim().toLowerCase();
      var pass  = $('pass').value || '';
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Please enter a valid email address.');
      if (!pass) return showErr('Please enter your password.');

      if (mode === 'login') {
        setBusy(true, 'Signing in…');
        var r = await api('/api/auth/login', { method:'POST', body: JSON.stringify({ email: email, password: pass }) });
        if (r.error) { setBusy(false, 'Log In &rarr;'); return showErr(r.error); }
        window.location.href = '/';
        return;
      }
      if (pass.length < 8) return showErr('Password must be at least 8 characters.');
      setBusy(true, 'Creating account…');
      var s = await api('/api/auth/signup', { method:'POST', body: JSON.stringify({ name: name, email: email, password: pass }) });
      if (s.error) { setBusy(false, 'Create account &rarr;'); return showErr(s.error); }
      window.location.href = '/';
    }
    $('submit').addEventListener('click', submit);
    $('form').addEventListener('submit', function(e){ e.preventDefault(); submit(); });

    // ── Default tab + return-flow notices ───────────────────────────────────
    try {
      setMode(localStorage.getItem('ig-saw-login') ? 'login' : 'signup');
      localStorage.setItem('ig-saw-login', '1');
    } catch(e) { setMode('login'); }
    setTimeout(function(){ try { $('email').focus(); } catch(e){} }, 100);

    try {
      var q = new URLSearchParams(location.search);
      if (q.get('verified') === '1') { setMode('login'); showNotice('Email verified — you can log in now.'); }
      else if (q.get('reset') === '1') { setMode('login'); showNotice('Password updated — log in with your new password.'); }
      else if (q.get('expired') === '1') { setMode('login'); showNotice('Your session expired — please log in again.'); }
      else if (q.get('social')) { setMode('login'); showNotice('Signed in with ' + q.get('social') + ' — loading…'); }
    } catch(e){}
  })();
  </script>
</body>
</html>
