name: PR10A P1 fix bootstrap

on:
  push:
    branches:
      - codex/add-google-ads-provider-draft-authority

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'PR10A: bootstrap P1 fix automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-google-ads-provider-draft-authority
          fetch-depth: 2

      - name: Verify expected PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "74f9a9cfc3c719a8de2b89239a91da515e6c55a1"

      - name: Apply the two reviewed P1 fixes and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}; got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # P1 #1: authoritative draft status must still be approved_for_publish.
          replace_once(
              'services/security/google_ads_provider_draft_capabilities.js',
              "const r=await c.query(`SELECT t.status AS tenant_status,d.workflow_id,d.id AS draft_id,d.current_revision,d.contract_hash,\n",
              "const r=await c.query(`SELECT t.status AS tenant_status,d.status AS draft_status,d.workflow_id,d.id AS draft_id,d.current_revision,d.contract_hash,\n",
          )
          replace_once(
              'services/security/google_ads_provider_draft_capabilities.js',
              "  if(x.tenant_status!=='active'||x.explicit_permission!==true||x.global_disabled||x.tenant_disabled\n",
              "  if(x.tenant_status!=='active'||x.draft_status!=='approved_for_publish'||x.explicit_permission!==true||x.global_disabled||x.tenant_disabled\n",
          )

          # P1 #2: narrowly anchored exemption from the legacy deployment-owner gate.
          replace_once(
              'server.js',
              "  /^\\/api\\/agent-orchestrator\\/meta-delivery-monitoring(?:\\/|$)/,\n  /^\\/api\\/agent-orchestrator\\/delivery-discrepancies(?:\\/|$)/,\n",
              "  /^\\/api\\/agent-orchestrator\\/meta-delivery-monitoring(?:\\/|$)/,\n  // Google Ads provider-draft authority is tenant-scoped and self-gates on a\n  // matching human session plus the exact explicit tenant permission. Keep the\n  // exemption path-anchored so lookalike orchestrator routes remain owner-gated.\n  /^\\/api\\/agent-orchestrator\\/google-ads-provider-draft-capabilities(?:\\/|$)/,\n  /^\\/api\\/agent-orchestrator\\/delivery-discrepancies(?:\\/|$)/,\n",
          )

          # Focused static regression coverage for both P1 fixes.
          test_path = Path('test/google-ads-provider-draft-capabilities-security.test.js')
          test_text = test_path.read_text()
          anchor = "test('authoritative approval revocation is selected under the validated alias',()=>{\n  const source=fs.readFileSync(require.resolve('../services/security/google_ads_provider_draft_capabilities'),'utf8');\n  assert.match(source,/pa\\.revoked_at AS approval_revoked_at/);\n  assert.match(source,/x\\.approval_revoked_at/);\n});\n"
          addition = anchor + "test('authoritative draft status remains approved_for_publish and the owner-gate exemption is narrowly anchored',()=>{\n  const source=fs.readFileSync(require.resolve('../services/security/google_ads_provider_draft_capabilities'),'utf8');\n  assert.match(source,/d\\.status AS draft_status/);\n  assert.match(source,/x\\.draft_status!==\\'approved_for_publish\\'/);\n  const server=fs.readFileSync(require.resolve('../server'),'utf8');\n  assert.equal(server.includes('google-ads-provider-draft-capabilities(?:\\\\/|$)'),true);\n  assert.equal(server.includes('google-ads-provider-draft-capabilities-export'),false);\n});\n"
          if test_text.count(anchor) != 1:
              raise SystemExit('security test anchor mismatch')
          test_path.write_text(test_text.replace(anchor, addition, 1))

          # PostgreSQL regression coverage: invalid draft states fail closed for
          # issuance, reservation, and consumption.
          int_path = Path('test/integration/google-ads-provider-draft-authority-postgres.test.js')
          text = int_path.read_text()

          issue_anchor = "  await assert.rejects(issue({ hasExplicitTenantPermission:()=>false }), denied('permission_denied'));\n\n  const raced = await Promise.allSettled([issue(), issue()]);\n"
          issue_insert = "  await assert.rejects(issue({ hasExplicitTenantPermission:()=>false }), denied('permission_denied'));\n\n  for (const status of ['cancelled','approval_expired','ready_for_approval']) {\n    await replica('UPDATE orchestrator_campaign_drafts SET status=$3 WHERE tenant_id=$1 AND id=$2',[tenant.id,ids.draft,status]);\n    await assert.rejects(issue({finalConfirmationId:id(`issue-${status}`),confirmedAt:new Date()}),denied('authoritative_binding_mismatch'));\n  }\n  await replica(\"UPDATE orchestrator_campaign_drafts SET status='approved_for_publish' WHERE tenant_id=$1 AND id=$2\",[tenant.id,ids.draft]);\n\n  const raced = await Promise.allSettled([issue(), issue()]);\n"
          if text.count(issue_anchor) != 1:
              raise SystemExit('integration issue anchor mismatch')
          text = text.replace(issue_anchor, issue_insert, 1)

          reserve_anchor = "  await assert.rejects(action('reserve',{reservationId:id('wrong-session')},{sessionId:id('other-session')}),denied('capability_rejected'));\n\n  await replica('UPDATE orchestrator_campaign_drafts SET current_revision=2 WHERE tenant_id=$1 AND id=$2',[tenant.id,ids.draft]);\n"
          reserve_insert = "  await assert.rejects(action('reserve',{reservationId:id('wrong-session')},{sessionId:id('other-session')}),denied('capability_rejected'));\n\n  for (const status of ['cancelled','approval_expired','ready_for_approval']) {\n    await replica('UPDATE orchestrator_campaign_drafts SET status=$3 WHERE tenant_id=$1 AND id=$2',[tenant.id,ids.draft,status]);\n    await assert.rejects(action('reserve',{reservationId:id(`reserve-${status}`)}),denied('authoritative_binding_mismatch'));\n  }\n  await replica(\"UPDATE orchestrator_campaign_drafts SET status='approved_for_publish' WHERE tenant_id=$1 AND id=$2\",[tenant.id,ids.draft]);\n\n  await replica('UPDATE orchestrator_campaign_drafts SET current_revision=2 WHERE tenant_id=$1 AND id=$2',[tenant.id,ids.draft]);\n"
          if text.count(reserve_anchor) != 1:
              raise SystemExit('integration reserve anchor mismatch')
          text = text.replace(reserve_anchor, reserve_insert, 1)

          consume_anchor = "  const reservation = [1,2].map((n)=>id(`reservation-${n}`)).find((value)=>crypto.createHash('sha256').update(value).digest('hex')===stored.reservation_id_hash);\n  const consumes = await Promise.allSettled([1,2].map((n)=>action('consume',{reservationId:reservation,invocationId:id(`invocation-${n}`)})));\n"
          consume_insert = "  const reservation = [1,2].map((n)=>id(`reservation-${n}`)).find((value)=>crypto.createHash('sha256').update(value).digest('hex')===stored.reservation_id_hash);\n  for (const status of ['cancelled','approval_expired','ready_for_approval']) {\n    await replica('UPDATE orchestrator_campaign_drafts SET status=$3 WHERE tenant_id=$1 AND id=$2',[tenant.id,ids.draft,status]);\n    await assert.rejects(action('consume',{reservationId:reservation,invocationId:id(`consume-${status}`)}),denied('authoritative_binding_mismatch'));\n  }\n  await replica(\"UPDATE orchestrator_campaign_drafts SET status='approved_for_publish' WHERE tenant_id=$1 AND id=$2\",[tenant.id,ids.draft]);\n  const consumes = await Promise.allSettled([1,2].map((n)=>action('consume',{reservationId:reservation,invocationId:id(`invocation-${n}`)})));\n"
          if text.count(consume_anchor) != 1:
              raise SystemExit('integration consume anchor mismatch')
          int_path.write_text(text.replace(consume_anchor, consume_insert, 1))
          PY

      - name: Run focused non-PostgreSQL gates
        shell: bash
        run: |
          set -euo pipefail
          node --test test/google-ads-provider-draft-authority-schema.test.js test/google-ads-provider-draft-capabilities-security.test.js
          npm run test:core
          node --check server.js
          node --check services/security/google_ads_provider_draft_capabilities.js
          node --check test/google-ads-provider-draft-capabilities-security.test.js
          node --check test/integration/google-ads-provider-draft-authority-postgres.test.js
          git diff --check

      - name: Commit and push fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr10a-p1-fix.yml
          git add server.js services/security/google_ads_provider_draft_capabilities.js test/google-ads-provider-draft-capabilities-security.test.js test/integration/google-ads-provider-draft-authority-postgres.test.js
          git commit -m "PR10A: address Codex P1 review findings"
          git push origin HEAD:codex/add-google-ads-provider-draft-authority
