name: Cursor automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Verify credentials, start a task, or control an existing task'
        type: choice
        options: [verify, start, follow-up, status, cancel]
        default: verify
        required: true
      issue_number:
        description: 'Tracking issue number (required for follow-up/status/cancel)'
        type: string
      prompt:
        description: 'Bounded task or follow-up instructions (not credentials)'
        type: string
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    # Best-effort fallback. GitHub may delay or skip scheduled jobs; this is not a five-minute SLA.
    - cron: '*/5 * * * *'
  check_suite:
    types: [completed]
  status:
  pull_request:
    types: [opened, reopened, closed, synchronize, converted_to_draft, ready_for_review]

# Never check out a task/PR branch with automation credentials. Always run trusted default-branch code.
# contents: read so this token cannot merge or push. pull-requests: write is only for opening draft PRs.
permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  statuses: read

# Serialises state transitions across all event types. Pending runs may be coalesced
# by GitHub; ignored start commands can be submitted again after the active job finishes.
concurrency:
  group: cursor-automation-control
  cancel-in-progress: false

jobs:
  bridge:
    if: >-
      github.repository == 'paulventer01/infogenie' &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.CURSOR_AUTOMATION_ENABLED == 'true' &&
        (github.event_name == 'schedule' ||
         github.event_name == 'check_suite' ||
         github.event_name == 'status' ||
         (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
         (github.event_name == 'issues' && startsWith(github.event.issue.body, '/cursor start')) ||
         (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/cursor ')))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Execute authorised automation command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AUTOMATION_ACTORS: ${{ vars.CURSOR_AUTOMATION_ACTORS }}
          CURSOR_AUTOMATION_ENABLED: ${{ vars.CURSOR_AUTOMATION_ENABLED }}
        run: node scripts/cursor-automation/run.js
