name: Agency time-entry checks

on:
  pull_request:
    paths:
      - 'components/features/manage/Agency*.tsx'
      - 'components/features/aiteam/Capacity.tsx'
      - 'components/features/registry.tsx'
      - 'lib/agency*.ts'
      - 'lib/capacityControls.ts'
      - 'lib/migratedViews.ts'
      - 'lib/viewRoutes.ts'
      - 'services/tenants/permission_matrix.js'
      - 'services/agency_ops/**'
      - 'services/capacity/**'
      - 'server.js'
      - 'test/agency-*.test.js'
      - 'test/capacity-controls*.test.js'
      - '.github/workflows/agency-time-entries.yml'
      - 'package*.json'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Match the Node 20 global environment expected by older dashboard tests.
      - run: node --no-experimental-global-navigator --test --test-force-exit test/capacity-controls.test.js test/capacity-controls-permissions.test.js test/agency-scope-budgets.test.js test/agency-scope-budgets-permissions.test.js test/agency-rate-cards.test.js test/agency-rate-cards-permissions.test.js test/agency-time-entries.test.js test/agency-time-entries-permissions.test.js test/agency-ops-dashboard.test.js test/migrated-views-lockstep.test.js test/permission-matrix.test.js
      - run: npm run test:core
        env:
          NODE_OPTIONS: --no-experimental-global-navigator

  capacity-eligibility-postgres:
    name: Capacity eligibility PostgreSQL (zero skips)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capacity_eligibility
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d capacity_eligibility"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify capacity task eligibility against PostgreSQL
        shell: bash
        env:
          PR10E7_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/capacity_eligibility
          PR10E7_REQUIRE_DATABASE: '1'
        run: |
          node --test --test-reporter=tap --test-force-exit test/capacity-controls-eligibility.test.js | tee /tmp/capacity-eligibility.tap
          grep -Eq '^# tests [1-9][0-9]*$' /tmp/capacity-eligibility.tap
          grep -Eq '^# skipped 0$' /tmp/capacity-eligibility.tap
